name = "aidesignkitchen"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false
keep_vars = true
routes = [{ pattern = "aidesignkitchen.com", custom_domain = true }]

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

[observability]
enabled = true

[vars]
NEXT_PUBLIC_WEB_URL = "https://aidesignkitchen.com"
AUTH_URL = "https://aidesignkitchen.com/api/auth"
AUTH_TRUST_HOST = "true"
KITCHEN_REPLICATE_MODEL = "google/nano-banana-2.1"
SUPABASE_STORAGE_BUCKET = "kitchen-design"
PAY_PROVIDER = "waffo"
# Complete docs/waffo-payments.md before deploying/enabling checkout.
# Set WAFFO_MODE, WAFFO_MERCHANT_ID, WAFFO_STORE_ID, WAFFO_PRODUCTS and CHECKOUT_ENABLED in runtime variables.
# Secrets: WAFFO_PRIVATE_KEY (PEM), REPLICATE_API_TOKEN (generation and image moderation).
# Keep the old DODO_* secrets until all historical payments are settled.
